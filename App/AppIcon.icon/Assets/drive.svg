<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- A drive with a capacity bar: free space, the "free" in freeside. Its activity light is lit.
       One slice (y 470-500) is knocked 34 px to the right. -->
  <defs><clipPath id="band"><rect x="-200" y="470" width="1424" height="30"/></clipPath><clipPath id="outside"><path d="M-200 -200 H1224 V470 H-200 Z M-200 500 H1224 V1224 H-200 Z"/></clipPath><linearGradient id="paper" gradientUnits="userSpaceOnUse" x1="0" y1="200" x2="0" y2="824"><stop offset="0" stop-color="#FBFAF6"/><stop offset="1" stop-color="#E4E2DC"/></linearGradient></defs>
  <g clip-path="url(#outside)"><rect x="150" y="300" width="724" height="424" rx="96" fill="none" stroke="url(#paper)" stroke-width="56"/><rect x="250" y="420" width="524" height="92" rx="24" fill="none" stroke="#5C5C5E" stroke-width="28"/><rect x="250" y="420" width="320" height="92" rx="24" fill="url(#paper)"/><rect x="706" y="610" width="84" height="46" rx="10" fill="#00EDFF"/></g><g clip-path="url(#band)" transform="translate(34 0)"><rect x="150" y="300" width="724" height="424" rx="96" fill="none" stroke="url(#paper)" stroke-width="56"/><rect x="250" y="420" width="524" height="92" rx="24" fill="none" stroke="#5C5C5E" stroke-width="28"/><rect x="250" y="420" width="320" height="92" rx="24" fill="url(#paper)"/><rect x="706" y="610" width="84" height="46" rx="10" fill="#00EDFF"/></g>
</svg>
